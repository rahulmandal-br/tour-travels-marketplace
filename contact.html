    <main class="container">
        <h2 class="section-title">Travel Desk Help Center</h2>
        <div class="form-container">
            <form action="#" method="POST">
                <div class="form-group"><label>Traveller Name</label><input type="text" required placeholder="Enter name"></div>
                <div class="form-group"><label>Email Address</label><input type="email" required placeholder="Enter email"></div>
                <div class="form-group"><label>Describe Requirement</label><textarea rows="4" required placeholder="Tell us about your next destination custom needs..."></textarea></div>
                <button type="submit" class="btn" style="width: 100%; border-radius:30px; cursor:pointer;">Submit Inquiry</button>
            </form>
        </div>
